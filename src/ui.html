 dibuang.":"சந்தாவும் அதன் அனைத்து சுயவிவரங்களும் நீக்கப்படும்.","Dipadam":"அழிக்கப்பட்டது","Mula semula servis?":"சேவையை மறுதொடக்கவா?","Mula semula servis":"சேவையை மறுதொடக்கு","Mula semula":"மறுதொடக்கு","Sambungan terhenti beberapa saat.":"இணைப்பு சில விநாடிகள் நிற்கும்.","Reboot modem?":"மோடமை ரீபூட் செய்யவா?","Reboot modem":"மோடமை ரீபூட் செய்","Reboot":"ரீபூட்","Internet terputus beberapa minit sehingga modem hidup semula.":"மோடம் மீண்டும் தொடங்கும் வரை சில நிமிடங்கள் இணையம் இருக்காது.","Modem akan reboot sebentar lagi":"மோடம் விரைவில் ரீபூட் ஆகும்","Servis VLESS dimulakan semula":"VLESS சேவை மறுதொடக்கப்பட்டது","UI dimulakan semula, muat semula halaman sebentar lagi":"UI மறுதொடக்கப்பட்டது, சிறிது நேரத்தில் பக்கத்தை மீண்டும் ஏற்றவும்","Servis":"சேவை","Mod VLESS: xray dimulakan semula. Mod XLITE: hanya UI ini dimulakan semula, XLITE tidak disentuh.":"VLESS முறை: xray மறுதொடக்கப்படும். XLITE முறை: இந்த UI மட்டும் மறுதொடக்கப்படும், XLITE தொடப்படாது.","Sandaran":"காப்புப்பிரதி","Muat turun sandaran konfigurasi":"உள்ளமைவு காப்புப்பிரதியைப் பதிவிறக்கு","Profil, langganan, kumpulan, penghalaan, tetapan dan lesen. Kata laluan tidak disertakan.":"சுயவிவரங்கள், சந்தாக்கள், குழுக்கள், வழித்தடம், அமைப்புகள், உரிமம். கடவுச்சொல் சேர்க்கப்படவில்லை.","Pulihkan daripada sandaran":"காப்புப்பிரதியிலிருந்து மீட்டமை","Pulihkan sandaran?":"காப்புப்பிரதியை மீட்டமைக்கவா?","Konfigurasi sedia ada akan digantikan.":"தற்போதைய உள்ளமைவு மாற்றப்படும்.","Pilih fail sandaran dahulu":"முதலில் காப்புப்பிரதி கோப்பைத் தேர்ந்தெடுக்கவும்","Dipulihkan":"மீட்டமைக்கப்பட்டது","Diagnostik":"கண்டறிதல்","Muat turun diagnostik":"கண்டறிதலைப் பதிவிறக்கு","Fail teks maklumat sistem dan log untuk bantuan teknikal. Tiada UUID atau kata laluan.":"தொழில்நுட்ப உதவிக்கான கணினி தகவல் மற்றும் பதிவுகள் கொண்ட உரை கோப்பு. UUID அல்லது கடவுச்சொல் இல்லை.","Beban purata":"சராசரி சுமை","Hidup modem":"மோடம் இயக்க நேரம்","Storan":"சேமிப்பு","Seni bina":"கட்டமைப்பு","berjalan":"இயங்குகிறது","berhenti":"நிறுத்தப்பட்டது","Versi dipas function poll(n,off){var um=$('um');if(!um)return;api('/api/update/state').then(function(s){if(!$('um'))return;$('um').textContent=s.msg;if(s.state=='err'){toast(s.msg);$('ub')&&($('ub').disabled=false);$('ur').disabled=false;return}if(s.state=='ok'){fin();return}setTimeout(function(){poll(n+1,off)},s.state=='done'?3000:1500)}).catch(function(){if(n>60){return}$('um')&&($('um').textContent='Memulakan semula UI...');setTimeout(function(){fetch('/api/status').then(function(r){return r.json()}).then(function(j){toast('Versi '+j.version+' dipasang');location.reload()}).catch(function(){poll(n+1,true)})},3000)})}
fin()}

function boot(){shell();load().then(function(){var h=(location.hash||'').slice(1).split('/'),v=h[0];if(!Object.prototype.hasOwnProperty.call(TT,v))v='home';go(v);if(v=='plus'&&h[1]!=null&&/^\d+$/.test(h[1]))plusOpen($('mn'),+h[1])}).catch(function(){});setInterval(function(){if(S&&V=='home'&&!busy)load()},5000);setInterval(function(){if(V=='home'&&isOn())ipq()},60000)}
function forcePass(){var d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:99;background:var(--bg,#111);padding:24px;overflow:auto';d.innerHTML='<h2>Tukar kata laluan</h2><p class="mu">Kata laluan awal hanya untuk pemasangan. Tetapkan kata laluan anda sendiri (min 6 aksara) sebelum meneruskan.</p><input id="fp" type="password" placeholder="Kata laluan baharu"><p></p><button class="p" id="fb" style="width:100%">Simpan</button>';document.body.appendChild(d);document.getElementById('fb').onclick=function(){api('/api/pass',document.getElementById('fp').value).then(function(r){if(!r.ok){toast(r.msg);return}document.cookie='vp='+r.token+';path=/;max-age=2592000';d.remove();boot()})}}
api('/api/status').then(function(s){if(s&&s.mustchange)forcePass();else boot()}).catch(function(){});
