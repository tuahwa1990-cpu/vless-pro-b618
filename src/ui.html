function rSys(m){api('/api/system').then(function(s){m.innerHTML='<div class="c">'+[['RAM',fB((s.memtot-s.memfree)*1024)+' / '+fB(s.memtot*1024)],['Storan',fB(s.disktot-s.diskfree)+' / '+fB(s.disktot)],['Beban purata',s.load],['Hidup modem',hms(parseFloat(s.uptime))],['Xray',s.xray?'berjalan':'berhenti'],['XLITE',s.xlite?'berjalan':'berhenti'],['Seni bina',s.arch]].map(function(x){return '<div class="kv"><span>'+x[0]+'</span><b>'+esc(x[1])+'</b></div>'}).join('')+'</div>'+
 '<div class="sec">Servis</div><div class="c"><button id="sr" style="width:100%">Mula semula servis</button><p class="mu">Mod VLESS: xray dimulakan semula. Mod XLITE: hanya UI ini dimulakan semula, XLITE tidak disentuh.</p><button id="rb2" class="d" style="width:100%">Reboot modem</button></div>'+

function fin(){api('/api/update').then(function(r){var h='<div class="kv"><span>Versi dipasang</span><b>'+esc(r.cur)+'</b></div>';

h+='<p class="mu" style="margin-top:14px">Tiada internet? Pilih fail .tgz kemas kini:</p><input type="file" id="uf" accept=".tgz,.tar.gz,application/gzip"><button id="ufb" style="width:100%;margin-top:6px">Pasang dari fail</button>';

function poll(n,off){var um=$('um');if(!um)return;api('/api/update/state').then(function(s){if(!$('um'))return;$('um').textContent=s.msg;if(s.state=='err'){toast(s.msg);$('ub')&&($('ub').disabled=false);$('ur').disabled=false;return}if(s.state=='ok'){fin();return}setTimeout(function(){poll(n+1,off)},s.state=='done'?3000:1500)}).catch(function(){if(n>60){return}$('um')&&($('um').textContent='Memulakan semula UI...');setTimeout(function(){fetch('/api/status').then(function(r){return r.json()}).then(function(j){toast('Versi '+j.version+' dipasang');location.reload()}).catch(function(){poll(n+1,true)})},3000)})}
fin()}
